name: Autonomous DevSecOps PR Remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autonomous-remediation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Extract PR Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          echo "Generated diff with size $(wc -c < pr.diff) bytes."

      - name: Run Multi-Agent Remediation Pipeline
        id: run-pipeline
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'mock' }}
          HOSTED_LLM_API_KEY: ${{ secrets.HOSTED_LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          devsecops-agent scan \
            --repo . \
            --diff-file pr.diff \
            --test-cmd "pytest" \
            --driver "local" \
            --output-report remediation_report.md

      - name: Post Verification Summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('remediation_report.md')) {
              const body = fs.readFileSync('remediation_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
